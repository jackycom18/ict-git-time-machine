<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>码道小助手</title>
  <style>
    :root {
      --wechat-green: #95ec69;
      --ink: #17181a;
      --muted: #9a9da3;
      --line: rgba(20, 24, 28, .08);
      --paper: #f5f6f7;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 28px;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, rgba(149, 236, 105, .22), transparent 28%),
        radial-gradient(circle at 85% 88%, rgba(43, 177, 120, .18), transparent 32%),
        linear-gradient(145deg, #dfe9e1, #edf1ee 52%, #d7e2dc);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    .phone {
      position: relative;
      display: grid;
      grid-template-rows: 32px 52px 1fr;
      width: 375px;
      height: 720px;
      overflow: hidden;
      border: 10px solid #17191d;
      border-radius: 42px;
      background: var(--paper);
      box-shadow:
        0 28px 80px rgba(19, 34, 25, .28),
        inset 0 0 0 1px rgba(255, 255, 255, .3);
    }

    .statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .01em;
      background: #f1f2f3;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #25272b;
    }

    .signal {
      display: flex;
      align-items: end;
      gap: 1px;
      height: 10px;
    }

    .signal i {
      display: block;
      width: 2px;
      border-radius: 1px;
      background: currentColor;
    }

    .signal i:nth-child(1) { height: 4px; }
    .signal i:nth-child(2) { height: 6px; }
    .signal i:nth-child(3) { height: 8px; }
    .signal i:nth-child(4) { height: 10px; }

    .wifi {
      width: 12px;
      height: 9px;
      border: 2px solid currentColor;
      border-width: 2px 2px 0;
      border-radius: 12px 12px 0 0;
    }

    .battery {
      position: relative;
      width: 18px;
      height: 9px;
      border: 1.5px solid currentColor;
      border-radius: 2px;
    }

    .battery::before {
      position: absolute;
      inset: 1.5px;
      border-radius: 1px;
      background: currentColor;
      content: "";
    }

    .battery::after {
      position: absolute;
      top: 2px;
      right: -4px;
      width: 2px;
      height: 3px;
      border-radius: 0 1px 1px 0;
      background: currentColor;
      content: "";
    }

    .topbar {
      display: grid;
      grid-template-columns: 76px 1fr 76px;
      align-items: center;
      padding: 0 15px;
      border-bottom: 1px solid var(--line);
      background: rgba(244, 245, 246, .94);
      backdrop-filter: blur(16px);
    }

    .back,
    .more {
      justify-self: start;
      color: #202226;
      font-size: 22px;
      line-height: 1;
    }

    .more {
      justify-self: end;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .title {
      margin: 0;
      overflow: hidden;
      font-size: 16px;
      font-weight: 650;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat {
      overflow-y: auto;
      padding: 20px 15px 24px;
      scrollbar-width: none;
      background:
        linear-gradient(rgba(245, 246, 247, .94), rgba(245, 246, 247, .94)),
        repeating-linear-gradient(135deg, transparent 0 13px, rgba(40, 70, 50, .025) 13px 14px);
    }

    .chat::-webkit-scrollbar { display: none; }

    .time-pill {
      width: max-content;
      margin: 0 auto 20px;
      padding: 4px 9px;
      border-radius: 5px;
      color: #9b9ea3;
      background: rgba(219, 221, 223, .62);
      font-size: 11px;
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-bottom: 17px;
      opacity: 1;
      transform: translateY(0);
    }

    .message.me {
      flex-direction: row-reverse;
    }

    .message.enter {
      animation: message-in .32s cubic-bezier(.2, .78, .25, 1) both;
    }

    @keyframes message-in {
      from {
        opacity: 0;
        transform: translateY(9px) scale(.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .avatar {
      display: grid;
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      place-items: center;
      border-radius: 5px;
      color: #fff;
      background: linear-gradient(145deg, #7e8c9b, #536171);
      box-shadow: 0 3px 9px rgba(31, 44, 54, .16);
      font-size: 12px;
      font-weight: 800;
    }

    .message.me .avatar {
      background: linear-gradient(145deg, #3b92dd, #1866b0);
    }

    .bubble {
      position: relative;
      max-width: 244px;
      padding: 10px 12px;
      border: 1px solid rgba(20, 24, 28, .06);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 4px 12px rgba(29, 39, 33, .08);
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
    }

    .bubble.me {
      background: var(--wechat-green);
    }

    .bubble::before {
      position: absolute;
      top: 13px;
      left: -6px;
      width: 10px;
      height: 10px;
      border-bottom: 1px solid rgba(20, 24, 28, .06);
      border-left: 1px solid rgba(20, 24, 28, .06);
      background: inherit;
      content: "";
      transform: rotate(45deg);
    }

    .bubble.me::before {
      right: -6px;
      left: auto;
      border: 0;
      border-top: 1px solid rgba(20, 24, 28, .06);
      border-right: 1px solid rgba(20, 24, 28, .06);
    }

    .typing {
      min-width: 54px;
      padding: 13px 15px;
    }

    .typing-dots {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 8px;
    }

    .typing-dots i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #91959a;
      animation: typing-bounce 1s infinite ease-in-out;
    }

    .typing-dots i:nth-child(2) { animation-delay: .14s; }
    .typing-dots i:nth-child(3) { animation-delay: .28s; }

    @keyframes typing-bounce {
      0%, 60%, 100% { opacity: .35; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-3px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .message.enter,
      .typing-dots i {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="微信聊天动画">
    <div class="statusbar">
      <span>9:41</span>
      <span class="status-icons" aria-hidden="true">
        <span class="signal"><i></i><i></i><i></i><i></i></span>
        <span class="wifi"></span>
        <span class="battery"></span>
      </span>
    </div>

    <header class="topbar">
      <span class="back" aria-hidden="true">‹</span>
      <h1 class="title">码道小助手</h1>
      <span class="more" aria-hidden="true">•••</span>
    </header>

    <section class="chat" aria-live="polite">
      <div class="time-pill">今天 14:20</div>

      <article class="message other">
        <div class="avatar" aria-label="码道小助手">AI</div>
        <div class="bubble">在吗？</div>
      </article>

      <article class="message me">
        <div class="avatar" aria-label="我">我</div>
        <div class="bubble me">在的，怎么啦？</div>
      </article>
    </section>
  </main>

  <script>
    const chat = document.querySelector('.chat');

    /**
     * 功能：等待指定时长后继续动画。
     * 输入：毫秒数 ms。
     * 输出：Promise，在等待结束后完成。
     */
    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    /**
     * 功能：让聊天容器滚动到最底部。
     * 输入：无。
     * 输出：无。
     */
    function scrollToBottom() {
      chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
    }

    /**
     * 功能：显示对方正在输入的三点状态。
     * 输入：无。
     * 输出：创建的提示消息元素。
     */
    function showTyping() {
      const row = document.createElement('article');
      row.className = 'message other typing enter';
      row.innerHTML = `
        <div class="avatar" aria-label="码道小助手">AI</div>
        <div class="bubble typing">
          <span class="typing-dots" aria-label="对方正在输入">
            <i></i><i></i><i></i>
          </span>
        </div>`;
      chat.appendChild(row);
      scrollToBottom();
      return row;
    }

    /**
     * 功能：追加一条聊天消息并触发出场动画。
     * 输入：消息文本 text 与是否为本人发送 mine。
     * 输出：无。
     */
    function appendMessage(text, mine) {
      const row = document.createElement('article');
      row.className = `message ${mine ? 'me' : 'other'} enter`;
      row.innerHTML = `
        <div class="avatar" aria-label="${mine ? '我' : '码道小助手'}">${mine ? '我' : 'AI'}</div>
        <div class="bubble${mine ? ' me' : ''}"></div>`;
      row.querySelector('.bubble').textContent = text;
      chat.appendChild(row);
      scrollToBottom();
    }

    /**
     * 功能：按脚本顺序循环播放七句聊天动画。
     * 输入：无。
     * 输出：无，异步持续运行。
     */
    async function playConversation() {
      const script = [
        ['我想用 AI 做一个无限动画，听说可以用 git 边做边回退？', false],
        ['对，思路很简单', true],
        ['满意就 commit，不满意就 checkout / reset 回退再改', false],
        ['懂了，那我先去试试', true],
        ['👍 有不懂的随时问。', false],
      ];

      while (true) {
        for (const [text, mine] of script) {
          await sleep(700);
          const typing = mine ? null : showTyping();
          await sleep(mine ? 420 : 1000);
          if (typing) typing.remove();
          appendMessage(text, mine);
        }
        await sleep(2600);
        while (chat.querySelectorAll('.message').length > 2) {
          chat.lastElementChild.remove();
        }
      }
    }

    playConversation();
  </script>
</body>
</html>
